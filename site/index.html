<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{SITE_NAME}} by {{AUTHOR}}</title>
  <meta name="description" content="{{TAGLINE}}">
  <meta name="theme-color" content="#FCF9F3">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{SITE_NAME}} by {{AUTHOR}}">
  <meta property="og:title" content="{{SITE_NAME}} by {{AUTHOR}}">
  <meta property="og:description" content="{{TAGLINE}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:url" content="{{PAGE_URL}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{PAGE_URL}}">

  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" href="assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <!-- Critical layout, inlined so the directory stays a tidy list even if the
       stylesheet is slow, blocked or stale. sandbox.css refines everything. -->
  <style>
    body{margin:0;background:#fcf9f3;color:#2a2826;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    .brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
    .brand__mark{width:28px;height:auto}
    .brand__text{display:flex;flex-direction:column;line-height:1.15}
    .chips{display:flex;gap:6px;overflow-x:auto}
    .directory{list-style:none;margin:0;padding:0}
    .entry__link{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
    .entry__logo{flex:0 0 52px;width:52px;height:52px;overflow:hidden}
    .entry__logo img{width:100%;height:100%;object-fit:contain}
    .entry__text{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
    .entry__chev svg,.entry__launch svg{width:14px;height:14px}
    .wrap{padding:0 16px}.skip-link{position:absolute;left:-9999px}
    .visually-hidden,.search__key{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    .chip{flex:0 0 auto;white-space:nowrap}.entry{padding:10px 0}
  </style>
  <link rel="stylesheet" href="assets/css/sandbox.css">
  <script src="assets/js/directory.js" defer></script>
</head>
<body class="home">
  <a class="skip-link" href="#directory">Skip to applications</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="./" aria-label="Sandbox by Cristian Perez, home">
        <img class="brand__mark" src="assets/brand/monogram-sm.png" alt="" width="44" height="41">
        <span class="brand__text">
          <span class="brand__name">Sandbox</span>
          <span class="brand__by">by Cristian Perez</span>
        </span>
      </a>
    </div>
  </header>

  <main class="wrap library">
    <div class="library__intro">
      <h1 class="library__title">Applications</h1>
      <p class="library__lede">{{TAGLINE}}</p>
    </div>

    <div class="finder">
      <label class="search">
        <span class="visually-hidden">Search applications</span>
        <svg class="search__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.25"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
        <input type="search" id="search" placeholder="Search applications…" autocomplete="off" spellcheck="false">
        <kbd class="search__key" aria-hidden="true">/</kbd>
      </label>
      <div class="chips" role="group" aria-label="Filter by discipline">
        {{FILTERS}}
      </div>
    </div>

    <ul class="directory" id="directory" role="list">
      {{ENTRIES}}
    </ul>

    <div class="empty" id="empty" hidden>
      <p class="empty__title">No applications found.</p>
      <p class="empty__text" id="empty-text">Try a different search or discipline.</p>
      <button type="button" class="button-quiet" id="clear">Show all applications</button>
    </div>

    <p class="visually-hidden" id="results-status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p>&copy; <span data-year>{{YEAR}}</span> {{AUTHOR}}</p>
      <a class="site-footer__link" href="{{GITHUB_URL}}" rel="me noopener">GitHub</a>
    </div>
  </footer>
</body>
</html>
