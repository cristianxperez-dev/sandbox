<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not found · Sandbox</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FCF9F3">
  <!-- 404.html is served at whatever URL was requested, so links here are absolute from BASE_PATH. -->
  <link rel="icon" href="{{BASE}}assets/brand/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{BASE}}assets/css/sandbox.css">
</head>
<body class="notfound-page">
  <main class="notfound">
    <a href="{{BASE}}" aria-label="Sandbox home"><img class="notfound__mark" src="{{BASE}}assets/brand/monogram.png" alt="" width="128" height="120"></a>
    <p class="eyebrow">404</p>
    <h1 class="notfound__title">This page wandered off.</h1>
    <p class="notfound__text">It may have moved, or it was never here. Everything that lives in Sandbox is listed in the collection.</p>
    <a class="button-quiet" href="{{BASE}}#apps">Browse the collection</a>
  </main>
</body>
</html>
